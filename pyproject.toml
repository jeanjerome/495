[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness495"
version = "0.2.0-dev"
description = "495: an agent harness that turns an intent into a verified, reviewed and traceable software change."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jean Jerome Levy", email = "jeanjerome.levy@gmail.com" },
]
maintainers = [
    { name = "Jean Jerome Levy", email = "jeanjerome.levy@gmail.com" },
]
keywords = [
    "agent",
    "llm",
    "code-generation",
    "code-review",
    "verification",
    "traceability",
    "sandbox",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=15,<16",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/jeanjerome/495"
Repository = "https://github.com/jeanjerome/495"
Issues = "https://github.com/jeanjerome/495/issues"

[project.scripts]
"495" = "harness495.interfaces.cli:main"
harness495 = "harness495.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-bdd>=8.1,<9",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.15,<3",
]

[tool.setuptools.packages.find]
include = ["harness495*"]

[tool.setuptools.package-data]
harness495 = ["data/*.json", "data/*.toml", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["B008", "SIM108", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: tests that call real agent CLIs or network (deselected by default)",
]

[tool.importlinter]
root_package = "harness495"
# Package boundaries: docs/decisions/0011-package-boundaries.md. Run with `lint-imports`;
# tests/test_architecture.py runs the same contracts under pytest.

[[tool.importlinter.contracts]]
name = "interfaces is the outermost layer: nothing else imports it"
type = "forbidden"
source_modules = ["harness495.core", "harness495.agents", "harness495.sandbox"]
forbidden_modules = ["harness495.interfaces"]

[[tool.importlinter.contracts]]
name = "sandbox imports nothing of 495 but core.models"
type = "forbidden"
source_modules = ["harness495.sandbox"]
forbidden_modules = ["harness495.core", "harness495.agents"]
ignore_imports = [
    "harness495.sandbox -> harness495.core.models",
    "harness495.sandbox.** -> harness495.core.models",
]

[[tool.importlinter.contracts]]
name = "agents import only sandbox, core.models and core.pricing"
type = "forbidden"
source_modules = ["harness495.agents"]
forbidden_modules = ["harness495.core"]
ignore_imports = [
    "harness495.agents.** -> harness495.core.models",
    "harness495.agents.** -> harness495.core.pricing",
    # sandbox's own permitted import, otherwise reported here as an indirect chain
    "harness495.sandbox -> harness495.core.models",
    "harness495.sandbox.** -> harness495.core.models",
]

[[tool.importlinter.contracts]]
name = "inside core, only engine reaches agents and only engine and verification reach sandbox"
type = "forbidden"
source_modules = ["harness495.core"]
forbidden_modules = ["harness495.agents", "harness495.sandbox"]
ignore_imports = [
    "harness495.core.engine -> harness495.agents.**",
    "harness495.core.engine -> harness495.sandbox",
    "harness495.core.engine -> harness495.sandbox.**",
    "harness495.core.verification -> harness495.sandbox",
    "harness495.core.verification -> harness495.sandbox.**",
]
