[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness495"
version = "0.1.0"
description = "495: an agent harness that turns an intent into a verified, reviewed and traceable software change."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jean Jerome Levy", email = "jeanjerome.levy@gmail.com" },
]
maintainers = [
    { name = "Jean Jerome Levy", email = "jeanjerome.levy@gmail.com" },
]
keywords = [
    "agent",
    "llm",
    "code-generation",
    "code-review",
    "verification",
    "traceability",
    "sandbox",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=15,<16",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/jeanjerome/495"
Repository = "https://github.com/jeanjerome/495"
Issues = "https://github.com/jeanjerome/495/issues"

[project.scripts]
"495" = "harness495.interfaces.cli:main"
harness495 = "harness495.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["harness495*"]

[tool.setuptools.package-data]
harness495 = ["data/*.json", "data/*.toml", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["B008", "SIM108", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: tests that call real agent CLIs or network (deselected by default)",
]
