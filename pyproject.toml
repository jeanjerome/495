[project]
name = "495"
version = "0.0.0"
description = "Développement logiciel assisté par IA, compréhensible et vérifiable"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26,<5",
]

[project.scripts]
495 = "harness495.cli:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "harness495"
