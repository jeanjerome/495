[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "four95"
version = "0.1.0"
description = "495: an agentic engineering harness that turns an intent into a verified, reviewed and traceable software change."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=15,<16",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
"495" = "four95.interfaces.cli:main"
four95 = "four95.interfaces.cli:main"

[tool.setuptools.packages.find]
include = ["four95*"]

[tool.setuptools.package-data]
four95 = ["data/*.json", "data/*.toml", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Interface prototypes, not shipped code: they are read and run, not maintained to the
# package's gates. extend-exclude keeps ruff's own defaults (.git, .venv, caches).
extend-exclude = ["mocs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["B008", "SIM108", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: tests that call real agent CLIs or network (deselected by default)",
]
